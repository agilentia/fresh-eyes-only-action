name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]


permissions:
  contents: read


concurrency:
  group: ci-${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true


jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: utils

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        uv venv .venv
        uv pip install -r requirements-dev.txt
    
    - name: Run unit tests
      run: |
        .venv/bin/python -m pytest -v -k "not integration" --cov=dismiss_approvals --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    defaults:
      run:
        working-directory: utils

    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: '3.12'
    
    - name: Install ruff
      run: |
        uv venv .venv
        uv pip install ruff
    
    - name: Run linting
      run: |
        .venv/bin/ruff check .
    
    - name: Check formatting
      run: |
        .venv/bin/ruff format --check .

